<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0f13">
<!--ENDED-->
<title>Add to the playlist</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2218 18 72 72%22><defs><linearGradient id=%22bg%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%220%22 x2=%22108%22 y2=%22108%22><stop offset=%220%22 stop-color=%22#1B1E2E%22/><stop offset=%221%22 stop-color=%22#0D0E15%22/></linearGradient><linearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%2224.5%22 y1=%2224.5%22 x2=%2283.5%22 y2=%2283.5%22><stop offset=%220%22 stop-color=%22#DCE3FF%22/><stop offset=%221%22 stop-color=%22#7C90FF%22/></linearGradient><clipPath id=%22r%22><rect x=%2218%22 y=%2218%22 width=%2272%22 height=%2272%22 rx=%2217%22/></clipPath></defs><g clip-path=%22url(#r)%22><rect width=%22108%22 height=%22108%22 fill=%22url(#bg)%22/><circle cx=%2254%22 cy=%2254%22 r=%2229.5%22 fill=%22url(#g)%22/><g fill=%22none%22 stroke=%22#0D0E15%22 stroke-opacity=%22.22%22 stroke-width=%221%22><circle cx=%2254%22 cy=%2254%22 r=%2226.5%22/><circle cx=%2254%22 cy=%2254%22 r=%2223.5%22/><circle cx=%2254%22 cy=%2254%22 r=%2220.5%22/></g><circle cx=%2254%22 cy=%2254%22 r=%2217.5%22 fill=%22#0D0E15%22/><path d=%22M44.51 58.55 C49.46 58.01 56.48 55.30 59.00 51.35 C60.80 48.47 59.00 45.67 55.76 45.86 C51.80 46.12 48.91 50.80 49.10 55.30 C49.27 59.80 52.52 62.33 56.30 62.15 C59.17 61.97 61.70 60.35 63.49 58.01%22 fill=%22none%22 stroke=%22url(#g)%22 stroke-width=%223.9%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></g></svg>">
<style>
  :root { --bg:#0e0f13; --card:#17191f; --card2:#1f222a; --text:#eceef3; --dim:#9aa0ad; --accent:#b4c5ff; --accent-ink:#0e1a3a; --warn:#ffb4a9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif; }
  body { padding:16px 16px calc(32px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:4px 0 2px; letter-spacing:-.3px; }
  .sub { color:var(--dim); font-size:13px; }
  .card { background:var(--card); border-radius:18px; padding:14px; margin-top:14px; }
  .now { display:flex; gap:14px; align-items:center; }
  .now img, .row img { background:var(--card2); object-fit:cover; flex:none; }
  .now img { width:84px; height:84px; border-radius:12px; }
  .row img { width:44px; height:44px; border-radius:8px; }
  .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a { color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grow { flex:1; min-width:0; }
  .bar { height:4px; background:var(--card2); border-radius:2px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  button { font:inherit; color:var(--text); background:var(--card2); border:0; border-radius:999px; padding:8px 14px; cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.icon { width:36px; height:36px; padding:0; display:inline-flex; align-items:center; justify-content:center; font-size:16px; }
  button:disabled { opacity:.4; }
  input { width:100%; font:inherit; color:var(--text); background:var(--card); border:1px solid #2a2e38; border-radius:999px; padding:12px 16px; outline:none; }
  input:focus { border-color:var(--accent); }
  h2 { font-size:15px; margin:22px 4px 6px; color:var(--dim); font-weight:600; }
  .row { display:flex; gap:12px; align-items:center; padding:8px 4px; border-radius:12px; }
  .row + .row { border-top:1px solid #1d2027; }
  .tag { font-size:11px; color:var(--accent); }
  .acts { display:flex; gap:4px; flex:none; }
  .banner { background:#3a2a1f; color:var(--warn); border-radius:12px; padding:10px 14px; margin-top:12px; font-size:13px; }
  .toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#2b2f3a; padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; }
  .toast.show { opacity:1; }
  .empty { color:var(--dim); text-align:center; padding:28px 0; }
  .hide { display:none !important; }
  dialog { background:var(--card); color:var(--text); border:0; border-radius:20px; padding:20px; width:min(92vw,380px); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="ended" class="empty hide"><h1>This link has been stopped</h1><p class="sub">Ask for a new one.</p></div>
<main id="app">
  <h1 id="title">Playlist</h1>
  <div class="sub" id="who">Add songs to this playlist</div>
  <div class="card">
    <input id="q" type="search" placeholder="Search for a song to add" autocomplete="off" enterkeyhint="search">
    <div id="results"></div>
  </div>
  <h2 id="count">Songs</h2>
  <div id="songs"></div>
</main>
<dialog id="name"><h1 style="font-size:18px">Your name</h1><p class="sub">So the others see who added what.</p>
  <input id="name-in" maxlength="30" placeholder="Your name"><p style="text-align:right;margin:14px 0 0">
  <button class="primary" id="name-ok">OK</button></p></dialog>
<div class="toast" id="toast"></div>
<script>
const base = location.pathname.replace(/\/$/, '');
const $ = id => document.getElementById(id);
let me = localStorage.getItem('collab-guest');
if (!me) { me = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('collab-guest', me); }
let name = localStorage.getItem('collab-name') || '';
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2200); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function img(c) { return c ? `<img loading="lazy" alt="" src="${base}/cover/${encodeURIComponent(c)}?s=150">` : '<img alt="">'; }
async function api(path, body) {
  const r = await fetch(base + path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {});
  if (r.status === 410) { $('app').classList.add('hide'); $('ended').classList.remove('hide'); throw new Error('ended'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
let ids = new Set();
async function refresh() {
  try {
    const s = await api('/state');
    $('title').textContent = s.name || 'Playlist';
    document.title = s.name ? `Add to ${s.name}` : 'Add to the playlist';
    $('who').textContent = s.owner ? `${s.owner}'s playlist: add songs from their library` : 'Add songs from the library';
    ids = new Set(s.song.map(x => x.id));
    $('count').textContent = `${s.song.length} song${s.song.length === 1 ? '' : 's'}`;
    $('songs').innerHTML = s.song.length ? s.song.map(x => `<div class="row">${img(x.cover)}<div class="grow"><div class="t">${esc(x.title)}</div>
      <div class="a">${esc(x.artist)}${x.by ? ` · <span class="tag">added by ${esc(x.by)}</span>` : ''}</div></div>
      ${x.guest === me ? `<div class="acts"><button class="icon" title="Take out" data-rm="${x.index}" data-id="${esc(x.id)}">✕</button></div>` : ''}</div>`).join('')
      : '<div class="empty">No songs yet: add the first one</div>';
  } catch (e) {}
}
function askName() { return new Promise(res => { if (name) return res(name); const d = $('name'); d.showModal();
  $('name-ok').onclick = () => { name = $('name-in').value.trim().slice(0, 30) || 'A friend'; localStorage.setItem('collab-name', name); d.close(); res(name); }; }); }
let timer;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 300); });
async function search() {
  const q = $('q').value.trim();
  if (q.length < 2) { $('results').innerHTML = ''; return; }
  try {
    const r = await api('/search?q=' + encodeURIComponent(q));
    $('results').innerHTML = r.songs.length ? r.songs.map(x => `<div class="row">${img(x.cover)}<div class="grow"><div class="t">${esc(x.title)}</div>
      <div class="a">${esc(x.artist)}${x.album ? ' · ' + esc(x.album) : ''}</div></div><div class="acts">
      <button class="${ids.has(x.id) ? '' : 'primary'}" data-add="${esc(x.id)}" ${ids.has(x.id) ? 'disabled' : ''}>${ids.has(x.id) ? 'In it' : 'Add'}</button></div></div>`).join('')
      : '<div class="empty">Nothing found</div>';
  } catch (e) { toast(e.message); }
}
document.addEventListener('click', async e => {
  const add = e.target.closest('[data-add]'), rm = e.target.closest('[data-rm]');
  try {
    if (add) { await askName(); add.disabled = true; await api('/add', {id: add.dataset.add, by: name, guest: me}); add.textContent = 'In it'; toast('Added'); await refresh(); }
    if (rm) { await api('/remove', {id: rm.dataset.id, index: +rm.dataset.rm, guest: me}); toast('Taken out'); await refresh(); search(); }
  } catch (err) { if (err.message !== 'ended') toast(err.message); if (add) add.disabled = false; }
});
if (document.querySelector('meta[name=share-ended]')) { $('app').classList.add('hide'); $('ended').classList.remove('hide'); }
else { refresh(); setInterval(refresh, 8000); }
</script>
</body>
</html>
