<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0f13">
<title>Shared songs</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2218 18 72 72%22><defs><linearGradient id=%22bg%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%220%22 x2=%22108%22 y2=%22108%22><stop offset=%220%22 stop-color=%22#1B1E2E%22/><stop offset=%221%22 stop-color=%22#0D0E15%22/></linearGradient><linearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%2224.5%22 y1=%2224.5%22 x2=%2283.5%22 y2=%2283.5%22><stop offset=%220%22 stop-color=%22#DCE3FF%22/><stop offset=%221%22 stop-color=%22#7C90FF%22/></linearGradient><clipPath id=%22r%22><rect x=%2218%22 y=%2218%22 width=%2272%22 height=%2272%22 rx=%2217%22/></clipPath></defs><g clip-path=%22url(#r)%22><rect width=%22108%22 height=%22108%22 fill=%22url(#bg)%22/><circle cx=%2254%22 cy=%2254%22 r=%2229.5%22 fill=%22url(#g)%22/><g fill=%22none%22 stroke=%22#0D0E15%22 stroke-opacity=%22.22%22 stroke-width=%221%22><circle cx=%2254%22 cy=%2254%22 r=%2226.5%22/><circle cx=%2254%22 cy=%2254%22 r=%2223.5%22/><circle cx=%2254%22 cy=%2254%22 r=%2220.5%22/></g><circle cx=%2254%22 cy=%2254%22 r=%2217.5%22 fill=%22#0D0E15%22/><path d=%22M44.51 58.55 C49.46 58.01 56.48 55.30 59.00 51.35 C60.80 48.47 59.00 45.67 55.76 45.86 C51.80 46.12 48.91 50.80 49.10 55.30 C49.27 59.80 52.52 62.33 56.30 62.15 C59.17 61.97 61.70 60.35 63.49 58.01%22 fill=%22none%22 stroke=%22url(#g)%22 stroke-width=%223.9%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></g></svg>">
<style>
  :root { --bg:#0e0f13; --card:#17191f; --card2:#1f222a; --text:#eceef3; --dim:#9aa0ad; --accent:#b4c5ff; --accent-ink:#0e1a3a; --warn:#ffb4a9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif; }
  body { padding:16px 16px calc(32px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:4px 0 2px; letter-spacing:-.3px; overflow-wrap:anywhere; }
  .sub { color:var(--dim); font-size:13px; }
  .card { background:var(--card); border-radius:18px; padding:14px; margin-top:14px; }
  .now { display:flex; gap:14px; align-items:center; }
  .now img, .row img { background:var(--card2); object-fit:cover; flex:none; }
  .now img { width:84px; height:84px; border-radius:12px; }
  .row img { width:44px; height:44px; border-radius:8px; }
  .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a { color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grow { flex:1; min-width:0; }
  audio { width:100%; margin-top:12px; }
  .row { display:flex; gap:12px; align-items:center; padding:8px; border-radius:12px; cursor:pointer; }
  .row + .row { border-top:1px solid #1d2027; }
  .row:hover { background:var(--card2); }
  .row.on .t { color:var(--accent); }
  .d { color:var(--dim); font-size:13px; flex:none; font-variant-numeric:tabular-nums; }
  .banner { background:#3a2a1f; color:var(--warn); border-radius:12px; padding:10px 14px; margin-top:12px; font-size:13px; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
<h1 id="title">Shared songs</h1>
<div class="sub" id="by"></div>
<div class="banner hide" id="ended">This link has run out or was stopped.</div>
<div class="card hide" id="player">
  <div class="now"><img id="ncover" alt=""><div class="grow"><div class="t" id="nt"></div><div class="a" id="na"></div></div></div>
  <audio id="audio" controls preload="none"></audio>
</div>
<div class="card hide" id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const base = location.pathname.replace(/\/$/, '');
let songs = [], cur = -1;
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function play(i) {
  if (i < 0 || i >= songs.length) return;
  cur = i;
  const s = songs[i];
  $('nt').textContent = s.title; $('na').textContent = s.artist + (s.album ? ' · ' + s.album : '');
  $('ncover').src = base + '/cover/' + s.n + '?s=300';
  $('audio').src = base + '/stream/' + s.n;
  $('audio').play().catch(() => {});
  document.querySelectorAll('.row').forEach((r, k) => r.classList.toggle('on', k === i));
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist, album: s.album,
      artwork: [{ src: base + '/cover/' + s.n + '?s=512', sizes: '512x512', type: 'image/jpeg' }] });
    navigator.mediaSession.setActionHandler('nexttrack', () => play(cur + 1));
    navigator.mediaSession.setActionHandler('previoustrack', () => play(cur - 1));
  }
}
$('audio').addEventListener('ended', () => play(cur + 1));
fetch(base + '/state').then(r => r.ok ? r.json() : Promise.reject(r.status)).then(st => {
  songs = st.song || [];
  if (st.description) { $('title').textContent = st.description; document.title = st.description; }
  $('by').textContent = 'Shared by ' + st.owner + ' · ' + songs.length + (songs.length === 1 ? ' song' : ' songs');
  const list = $('list');
  songs.forEach((s, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = base + '/cover/' + s.n;
    const g = document.createElement('div'); g.className = 'grow';
    const t = document.createElement('div'); t.className = 't'; t.textContent = s.title;
    const a = document.createElement('div'); a.className = 'a'; a.textContent = s.artist;
    const d = document.createElement('div'); d.className = 'd'; d.textContent = mmss(s.duration);
    g.append(t, a); row.append(img, g, d); row.onclick = () => play(i);
    list.append(row);
  });
  $('list').classList.remove('hide'); $('player').classList.remove('hide');
  if (songs.length) { cur = 0; $('nt').textContent = songs[0].title; $('na').textContent = songs[0].artist; $('ncover').src = base + '/cover/' + songs[0].n + '?s=300'; $('audio').src = base + '/stream/' + songs[0].n; }
}).catch(() => { $('ended').classList.remove('hide'); $('by').textContent = ''; });
</script>
</body>
</html>
