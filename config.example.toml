# Maestro settings. Copy to config.toml (or point MAESTRO_CONFIG / --config at it).
# Every setting can also come from the environment: MAESTRO_DATA_DIR, MAESTRO_LISTEN, MAESTRO_MUSIC,
# MAESTRO_SENTINEL, MAESTRO_SCAN_THREADS, MAESTRO_SCAN_INTERVAL_MIN, MAESTRO_FFMPEG.

# Database, password key and caches. Keep this on the internal disk, not on the music drive.
# Default: ~/.local/share/maestro (Linux), %ProgramData%\maestro (Windows).
# data_dir = "/var/lib/maestro"

listen = "127.0.0.1:4533"
scan_interval_min = 15
# ffmpeg = "C:\\Program Files\\ffmpeg\\bin\\ffmpeg.exe"

[[libraries]]
name = "Music"
path = "/mnt/media/data/media/music"
# A file that must be in the folder for it to count as connected. Without one, any content counts.
# sentinel = ".library-id"
# Files read at once while scanning: 1-2 for a spinning USB drive, 8 for an SSD.
scan_threads = 2
