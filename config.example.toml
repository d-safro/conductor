# Conductor settings. Copy to config.toml (or point CONDUCTOR_CONFIG / --config at it).
# Every setting can also come from the environment: CONDUCTOR_DATA_DIR, CONDUCTOR_LISTEN, CONDUCTOR_MUSIC,
# CONDUCTOR_SENTINEL, CONDUCTOR_SCAN_THREADS, CONDUCTOR_SCAN_INTERVAL_MIN, CONDUCTOR_FFMPEG.

# Database, password key and caches. Keep this on the internal disk, not on the music drive.
# Default: ~/.local/share/conductor (Linux), %ProgramData%\conductor (Windows).
# data_dir = "/var/lib/conductor"

listen = "127.0.0.1:4533"
# Never write to the music folders (no downloads, trial moves or covers): for a trial run beside another server.
read_only = false
scan_interval_min = 15

# Jam: the guest page listens here (put only this port on the internet), and guests open jam_public_url.
jam_listen = "127.0.0.1:4535"
# jam_public_url = "https://music.example.com:8443"

# Podcasts: where saved episodes go (not the music folder), how many of the newest to keep per show, and how
# many days after you finish one it goes (0: never).
# podcast_dir = "/srv/podcasts"
podcast_keep = 0
podcast_clean_days = 7
# feeds on this computer or your own network (off: podcasts come only from the internet)
# podcast_local = false

# A backup of the database, its key and these settings once a day; the newest 7 are kept (0: none).
# `conductor backup` makes one now, `conductor restore FILE` puts one back.
backup_keep = 7
# backup_dir = "/srv/backups/conductor"   # default: <data_dir>/backups

# Downloads are optional: everything else works without them. `conductor setup downloads` sets one container up.
# Songs you don't have (⬇, from Deezer) and downloading them through slskd. Filing needs write access to the music folder.
# catalog = true   # default: on when slskd or Lidarr is set, off otherwise
catalog_skip_clients = ["symfonium", "audiomuse"]   # AudioMuse analyses files: never songs you don't have
# slskd_url = "http://127.0.0.1:5030"
# slskd_api_key = "…"                       # or CONDUCTOR_SLSKD_API_KEY
# slskd_downloads = "/srv/soulseek/complete"
# import_library = "Music"
# Songs you play but don't have: deleted this many hours after they arrive unless kept; at most this many a day.
trial_hours = 24
trial_per_day = 40

# Lidarr's wanted albums, fetched from Soulseek and handed to Lidarr to import (what Soularr did).
# lidarr_url = "http://127.0.0.1:8686"
# lidarr_api_key = "…"                      # or CONDUCTOR_LIDARR_API_KEY
# lidarr_downloads = "/data/soulseek/complete"   # the downloads folder as Lidarr sees it
lidarr_interval_min = 5
lidarr_albums_per_run = 20
lidarr_match_ratio = 0.8

# ListenBrainz: plays are sent there; its playlists made for you become discovery playlists (what Explo did).
# listenbrainz_user = "you"
# listenbrainz_token = "…"                   # or CONDUCTOR_LISTENBRAINZ_TOKEN
# listenbrainz_for = "you-in-conductor"        # default: the first admin
discovery = ["weekly-exploration", "weekly-jams", "daily-jams"]

# AudioMuse-AI (optional): sound-alike songs and Encore's recommendation calls.
# audiomuse_url = "http://127.0.0.1:8000"
# audiomuse_token = "…"                      # or CONDUCTOR_AUDIOMUSE_TOKEN
# ffmpeg = "C:\\Program Files\\ffmpeg\\bin\\ffmpeg.exe"

# Lyrics translation by a local Ollama (off unless set)
# ollama_url = "http://127.0.0.1:11434"
# translate_model = "gemma4:e2b-it-qat"
# "What's playing?" against your own library (the song-id service), and Automix (the mix analyzer's folder)
# songid_url = "http://127.0.0.1:4540"
# Encore's DJ: lines by the Ollama above, read aloud by Piper (the dj-voice service); off unless both are set
# dj_voice_url = "http://127.0.0.1:4541"
# dj_model = "gemma4:e2b-it-qat"            # default: translate_model
# mixinfo_dir = "/srv/mixinfo"
# Concerts near you (Ticketmaster with the key set in Encore, else MusicBrainz)
# concerts = true
# Downloads through a VPN (`conductor setup vpn` sets these): "none", "existing" (slskd already behind one), "gluetun"
# (slskd inside gluetun, set up by Prelude) or "proxy" (Conductor's own download traffic through `proxy`)
# vpn = "none"
# vpn_check_url = "http://127.0.0.1:8000/v1/publicip/ip"   # gluetun's control server; key in secrets.toml (vpn_check_key)
# downloads_require_vpn = true          # the kill switch: downloads wait while the VPN check fails
# vpn_port_sync = false                 # keep slskd's listen port on the VPN's forwarded port
# proxy = "socks5h://127.0.0.1:1080"    # (in secrets.toml when it has a password)
# proxy_metadata = false                # covers and lyrics through the proxy too
# Keys, tokens and passwords can live in secrets.toml beside this file (Prelude puts them there):
# slskd_api_key, lidarr_api_key, listenbrainz_token, lastfm_api_key, audiomuse_token, vpn_check_key, proxy.
# Imports from Last.fm (scrobbles and loved songs by user name) need a free API key: last.fm/api/account/create
# lastfm_api_key = "…"                       # or CONDUCTOR_LASTFM_API_KEY
# Artist biographies and album notes from MusicBrainz → Wikidata → Wikipedia (no key), kept once found
# info_online = true
# info_lang = "en"                         # Wikipedia's language; English when there's no page in it

[[libraries]]
name = "Music"
path = "/srv/music"
# A file that must be in the folder for it to count as connected. Without one, any content counts.
# sentinel = ".library-id"
# Files read at once while scanning: 1-2 for a spinning USB drive, 8 for an SSD.
scan_threads = 2
