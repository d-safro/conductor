# Example only. Runs beside Navidrome on another port.
services:
  conductor:
    image: conductor:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: conductor
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      CONDUCTOR_SCAN_THREADS: "2"
    volumes:
      - ./config/conductor:/data:Z           # internal disk
      - ${DATA}/media/music:/music:ro
    ports: ["127.0.0.1:4590:4533"]
