# Example only. Runs beside Navidrome on another port. (To build from the source: image: conductor:dev and
# build: { context: .., dockerfile: deploy/Dockerfile })
services:
  conductor:
    image: ghcr.io/d-safro/conductor:latest
    container_name: conductor
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      CONDUCTOR_SCAN_THREADS: "2"
    volumes:
      - ./config/conductor:/data:Z           # internal disk
      - ${DATA}/media/music:/music:ro
    ports: ["127.0.0.1:4590:4533"]
