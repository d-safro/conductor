# Example only. Runs beside Navidrome on another port.
services:
  maestro:
    image: maestro:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: maestro
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      MAESTRO_SCAN_THREADS: "2"
    volumes:
      - ./config/maestro:/data:Z           # internal disk
      - ${DATA}/media/music:/music:ro
    ports: ["127.0.0.1:4590:4533"]
