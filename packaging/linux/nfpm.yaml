# Conductor's Linux packages (.deb, .rpm, Arch), made by nfpm from the release's static program:
#   install -D -m 755 path/to/conductor packaging/linux/build/conductor   (nfpm takes no variables in paths)
#   VERSION=0.6.0 ARCH=amd64 nfpm package -p deb -f packaging/linux/nfpm.yaml -t out/
name: conductor
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: sound
priority: optional
maintainer: "d-safro <330074961+d-safro@users.noreply.github.com>"
description: |
  Your own music server: Subsonic and OpenSubsonic for every app, with Encore's extras.
  After installing, set it up with `conductor setup`.
vendor: d-safro
homepage: https://github.com/d-safro/conductor
license: AGPL-3.0-or-later
recommends:
  - ffmpeg
contents:
  - src: packaging/linux/build/conductor
    dst: /usr/bin/conductor
    file_info: { mode: 0755 }
  - src: packaging/linux/conductor.service
    dst: /usr/lib/systemd/system/conductor.service
  - src: packaging/linux/sysusers.conf
    dst: /usr/lib/sysusers.d/conductor.conf
  - src: packaging/linux/tmpfiles.conf
    dst: /usr/lib/tmpfiles.d/conductor.conf
  - src: README.md
    dst: /usr/share/doc/conductor/README.md
  - src: docs/GUIDE.md
    dst: /usr/share/doc/conductor/GUIDE.md
  - src: docs/CONFIG.md
    dst: /usr/share/doc/conductor/CONFIG.md
  - src: LICENSE
    dst: /usr/share/licenses/conductor/LICENSE
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
  postremove: packaging/linux/postremove.sh
archlinux:
  scripts:
    # pacman runs post_install only on a first install: an upgrade restarts the running service too, as .deb and .rpm do
    postupgrade: packaging/linux/postinstall.sh
